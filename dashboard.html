<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | VR Academics</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard-container">
        <div class="profile-panel">
            <div class="student-card">
                <h2 id="welcomeName">Loading Student Profile...</h2>
                <p id="studentMeta" style="color: #00f2fe; margin-top: 5px; font-weight: 500;"></p>
                <button id="studentLogout" class="logout-link">Log Out Profile</button>
            </div>

            <div class="notice-box">
                <h3>Institute Notices</h3>
                <div id="noticeContainer" class="notice-list">
                    <p style="color: #64748b;">Synchronizing announcements...</p>
                </div>
            </div>
        </div>

        <div class="content-panel">
            
            <div class="calendar-section" style="background: #0b0d19; border: 1px solid rgba(255, 255, 255, 0.05); padding: 25px; border-radius: 20px; display: grid; grid-template-columns: 1fr 320px; gap: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);">
                
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h3 id="calendarMonthTitle" style="font-size: 1.2rem; font-weight: 700; color: #fff; margin: 0;">Academic Schedule</h3>
                        <span style="font-size: 11px; color: #00f2fe; font-weight: 600; background: rgba(0, 242, 254, 0.05); border: 1px solid rgba(0, 242, 254, 0.15); padding: 4px 10px; border-radius: 20px;">Live Batch Tracker</span>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: #64748b; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    
                    <div id="calendarDaysGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;">
                        </div>
                </div>

                <div style="background: #121526; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.02);">
                    <h4 style="font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 15px; letter-spacing: 0.5px;">Month Agenda Events</h4>
                    <div id="agendaEventList" style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto; max-height: 240px; flex: 1; padding-right: 4px;">
                        <p style="color: #64748b; font-size: 13px; text-align: center; margin-top: 20px;">Synchronizing schedules...</p>
                    </div>
                </div>
            </div>

            <div class="subject-filter-bar">
                <h3>Academic Materials Repository</h3>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterSubject('All')">All Subjects</button>
                    <button class="filter-btn" onclick="filterSubject('Physics')">Physics</button>
                    <button class="filter-btn" onclick="filterSubject('Chemistry')">Chemistry</button>
                    <button class="filter-btn" onclick="filterSubject('Mathematics')">Mathematics</button>
                    <button class="filter-btn" onclick="filterSubject('Biology')">Biology</button>
                    <button class="filter-btn" onclick="filterSubject('Accounts')">Accounts</button>
                    <button class="filter-btn" onclick="filterSubject('Economics')">Economics</button>
                    <button class="filter-btn" onclick="filterSubject('B.st')">B.st</button>
                </div>
            </div>

            <div id="resourcesGrid" class="resources-grid">
                </div>
        </div>
    </div>  

    <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;"></div>

    <script src="dashboard.js"></script>
</body>
</html>
